name: Build manual

on:
  push:
    branches:
      - main
      - 'c/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile PDF
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            latexmk \
            texlive-luatex \
            texlive-latex-extra \
            texlive-bibtex-extra \
            texlive-plain-generic

      - name: Build manual
        run: make pdf

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: breadbox-manual
          path: build/book.pdf
          if-no-files-found: error
          retention-days: 14
